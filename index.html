<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glowstick</title>
<link rel="icon" href="icon-192.png">
<style>
/* ---- css/base.css ---- */
/* Glowstick design tokens. Near-black background, neon accents for edges, bars and labels; body text stays
   high-contrast. Glow is a budget: only the primary money card and the reward layer get it. */
:root {
  /* colour roles */
  --bg: #070410;
  --bg-2: #0d0819;
  --surface-1: #150e2a;                  /* cards */
  --surface-2: #1d1438;                  /* nested boxes, inputs, buttons */
  --surface-3: #0a0616;                  /* recessed: input wells, tables */
  --line: rgba(190, 140, 255, 0.16);
  --line-strong: rgba(190, 140, 255, 0.38);
  --text: #f3f0fb;
  --muted: #b9b0d8;
  --dim: #877ca9;
  /* accent set */
  --pink: #ff2fd2;   --pink-rgb: 255, 47, 210;
  --cyan: #21f0ff;   --cyan-rgb: 33, 240, 255;
  --lime: #c3ff3d;   --lime-rgb: 195, 255, 61;
  --violet: #9b6bff; --violet-rgb: 155, 107, 255;
  --amber: #ffb52e;  --amber-rgb: 255, 181, 46;
  --red: #ff4f6e;    --red-rgb: 255, 79, 110;
  --pink-soft: rgba(var(--pink-rgb), 0.16);
  --cyan-soft: rgba(var(--cyan-rgb), 0.14);
  --lime-soft: rgba(var(--lime-rgb), 0.14);
  --violet-soft: rgba(var(--violet-rgb), 0.18);
  --amber-soft: rgba(var(--amber-rgb), 0.16);
  --danger-soft: rgba(var(--red-rgb), 0.16);
  /* status roles */
  --ok: var(--lime);      --ok-rgb: var(--lime-rgb);
  --warn: var(--amber);   --warn-rgb: var(--amber-rgb);
  --danger: var(--red);   --danger-rgb: var(--red-rgb);
  --info: var(--cyan);    --info-rgb: var(--cyan-rgb);
  /* type scale (4 sizes) */
  --fs-sm: 0.8rem;
  --fs-md: 1rem;
  --fs-lg: 1.35rem;
  --fs-xl: clamp(1.9rem, 9vw, 2.4rem);
  /* spacing scale */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  /* radii */
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  /* glow levels: box-shadow values tinted by --glow-rgb (set per accent). 0 = none, 1 = primary card, 2 = reward */
  --glow-rgb: var(--violet-rgb);
  --glow-0: none;
  --glow-1: 0 0 0 1px rgba(var(--glow-rgb), 0.16), 0 0 22px rgba(var(--glow-rgb), 0.18);
  --glow-2: 0 0 0 1px rgba(var(--glow-rgb), 0.28), 0 0 34px rgba(var(--glow-rgb), 0.34), 0 0 70px rgba(var(--glow-rgb), 0.16);
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  /* motion */
  --t-fast: 120ms;
  --t-med: 250ms;
  --t-slow: 500ms;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-pop: cubic-bezier(0.2, 1.6, 0.4, 1);
  --font: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --mono: "Cascadia Mono", Consolas, "Roboto Mono", monospace;
  --tabs-h: 64px;
  --fab-h: 58px;
  /* legacy aliases still referenced by other modules */
  --panel: var(--surface-1);
  --panel-2: var(--surface-2);
  --radius: var(--r-lg);
  --radius-sm: var(--r-md);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
html { font-size: 17px; }
body {
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  line-height: 1.45;
  overflow-x: hidden;
  padding-bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px));
}
/* background wash: two radial gradients on a fixed pseudo-element; no blur filter (expensive on cheap phones) */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(60vw 60vw at 100% -10%, rgba(var(--pink-rgb), 0.22), transparent 65%),
    radial-gradient(70vw 70vw at -10% 105%, rgba(var(--cyan-rgb), 0.16), transparent 65%),
    var(--bg);
}
h1, h2, h3, h4 { margin: 0 0 var(--s-2); font-weight: 650; letter-spacing: .01em; overflow-wrap: anywhere; }
h2 { font-size: var(--fs-lg); }
h3 { color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-size: var(--fs-sm); font-weight: 700; }
p { margin: var(--s-1) 0 var(--s-3); }
a { color: var(--cyan); }
button, input, select, textarea { font: inherit; color: inherit; }
textarea { resize: vertical; }
::selection { background: rgba(var(--pink-rgb), .4); }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.small { font-size: .88rem; }
.tiny { font-size: var(--fs-sm); }
.hidden { display: none !important; }
.right { text-align: right; }
.center { text-align: center; }
.row { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.grow { flex: 1 1 auto; }
.mt { margin-top: var(--s-4); }
.mb { margin-bottom: var(--s-4); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.pink { color: var(--pink); }
.cyan { color: var(--cyan); }
.lime { color: var(--lime); }
.violet { color: var(--violet); }
.amber { color: var(--amber); }
.danger { color: var(--danger); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* keyboard focus: cyan ring on everything interactive; pointer focus stays quiet */
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: var(--r-sm); }
:focus:not(:focus-visible) { outline: none; }
.field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible { outline: none; }

/* Reduced motion: decorative animation off, state changes stay instant and visible. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  .xp.charging .bar > i { box-shadow: none !important; filter: none !important; transform: none !important; }
  .mascot img, .mascot .bubble, .mascot.in .bubble { animation: none !important; }
  .mascot { transition: none !important; }
  .playcard.back { animation: none !important; }
  .celebrate .box { animation: none !important; }
}
</style>
<style>
/* ---- css/layout.css ---- */
/* Top bar and bottom tabs: the only two surfaces that keep backdrop-filter. */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: var(--s-3);
  padding: calc(var(--s-3) + env(safe-area-inset-top, 0px)) var(--s-4) var(--s-2);
  background: linear-gradient(180deg, rgba(7,4,16,.96), rgba(7,4,16,.86));
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { font-weight: 800; font-size: 1.25rem; letter-spacing: .04em; display: flex; align-items: center; gap: var(--s-2); white-space: nowrap; }
.brand-bar {
  width: 6px; height: 1.3rem; border-radius: 3px; flex: 0 0 auto;
  background: linear-gradient(180deg, var(--pink), var(--cyan), var(--lime));
  box-shadow: 0 0 10px rgba(var(--pink-rgb), .8), 0 0 18px rgba(var(--cyan-rgb), .4);
}
.brand-sub { color: var(--muted); font-size: .85rem; margin-left: auto; display: flex; align-items: center; gap: var(--s-2); min-width: 0; }
.view { padding: var(--s-4) var(--s-4) var(--s-5); max-width: 760px; margin: 0 auto; }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  height: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: grid; grid-template-columns: repeat(7, 1fr);
  background: rgba(9, 5, 20, .96); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
.tabs button {
  background: none; border: 0; color: var(--muted); font-size: .7rem; font-weight: 600;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  letter-spacing: .02em; cursor: pointer; padding: 0; min-width: 0; white-space: nowrap; overflow: hidden;
  transition: color var(--t-fast) var(--ease);
}
.tabs button .ico { font-size: 1.25rem; line-height: 1; }
.tabs button.active { color: var(--cyan); text-shadow: 0 0 10px rgba(var(--cyan-rgb),.6); }
.tabs button.active .ico { color: var(--pink); text-shadow: 0 0 12px var(--pink); }
.tabs button:focus-visible { outline-offset: -3px; }
@media (max-width: 340px) { .tabs button { font-size: .62rem; letter-spacing: 0; } .tabs button .ico { font-size: 1.15rem; } }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-3); }
@media (max-width: 420px) { .grid3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 359px) { .grid2, .field-row, .loan-compare { grid-template-columns: 1fr; } }

/* XP strip in the top bar */
.xp { display: flex; align-items: center; gap: var(--s-2); position: relative; }
.xp .lvl { font-weight: 800; color: var(--lime); text-shadow: 0 0 10px rgba(var(--lime-rgb),.6); font-size: .85rem; white-space: nowrap; }
.xp .bar { width: 64px; height: 7px; flex: 0 0 auto; }
.xp .streak { color: var(--amber); font-weight: 700; font-size: .85rem; white-space: nowrap; }
@media (max-width: 340px) { .xp .bar { width: 44px; } }

/* XP fill animation: the bar's glow and jitter scale with how full it is (set from JS via --f) */
.xp .bar { position: relative; overflow: visible; }
.xp .bar > i { will-change: width, box-shadow, transform; transition: none; }
.xp.charging .bar > i { box-shadow: 0 0 calc(4px + 16px * var(--f, 0)) rgba(var(--lime-rgb), calc(.35 + .65 * var(--f, 0))), 0 0 calc(2px + 30px * var(--f, 0)) rgba(var(--cyan-rgb), calc(.6 * var(--f, 0))); filter: brightness(calc(1 + .8 * var(--f, 0))); }
.xp.burst .bar > i { animation: xpburst .55s ease-out; }
.xp.burst .lvl { animation: lvlpop .6s var(--ease-pop); }
@keyframes xpburst { 0% { filter: brightness(2.6); box-shadow: 0 0 30px var(--lime), 0 0 60px var(--cyan), 0 0 90px var(--pink); } 100% { filter: brightness(1); box-shadow: 0 0 10px rgba(var(--lime-rgb),.5); } }
@keyframes lvlpop { 0% { transform: scale(1); } 40% { transform: scale(1.6); color: #fff; text-shadow: 0 0 18px var(--lime), 0 0 30px var(--pink); } 100% { transform: scale(1); } }
.xp .gain { position: absolute; right: 0; top: -1.1rem; font-size: .75rem; font-weight: 800; color: var(--lime); text-shadow: 0 0 8px rgba(var(--lime-rgb),.8); animation: gainfloat 1s ease-out forwards; pointer-events: none; }
@keyframes gainfloat { 0% { opacity: 0; transform: translateY(6px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
</style>
<style>
/* ---- css/components.css ---- */
/* ---- Cards. ONE card style with two axes: accent-* (which neon tints the edge) and level.
   secondary (default): plain border, no glow. primary: the money card, glow-1. tertiary: mascot / badges /
   rewards, a soft glow that must not out-shine money numbers. */
.card {
  --accent: var(--violet);
  background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: var(--s-3) var(--s-4); margin-bottom: var(--s-3); box-shadow: var(--shadow);
  min-width: 0;
}
.card.accent-pink   { --accent: var(--pink);   --glow-rgb: var(--pink-rgb);   border-color: rgba(var(--pink-rgb), .35); }
.card.accent-cyan   { --accent: var(--cyan);   --glow-rgb: var(--cyan-rgb);   border-color: rgba(var(--cyan-rgb), .35); }
.card.accent-lime   { --accent: var(--lime);   --glow-rgb: var(--lime-rgb);   border-color: rgba(var(--lime-rgb), .35); }
.card.accent-amber  { --accent: var(--amber);  --glow-rgb: var(--amber-rgb);  border-color: rgba(var(--amber-rgb), .4); }
.card.accent-violet { --accent: var(--violet); --glow-rgb: var(--violet-rgb); border-color: rgba(var(--violet-rgb), .4); }
.card.accent-danger { --accent: var(--danger); --glow-rgb: var(--danger-rgb); border-color: rgba(var(--danger-rgb), .45); }
.card.primary { border-color: rgba(var(--glow-rgb), .55); box-shadow: var(--shadow), var(--glow-1); }
.card.tertiary { background: rgba(21, 14, 42, .7); box-shadow: 0 0 18px rgba(var(--glow-rgb), .12); }
.card h3 { margin-bottom: var(--s-2); }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-2); margin-bottom: var(--s-2); min-width: 0; }
.card-head > :first-child { min-width: 0; }
.card-head h3 { margin: 0; }
.card-head .btn.sm { margin-top: -6px; white-space: nowrap; flex: 0 0 auto; }
.card.tap { cursor: pointer; }

/* Stat: label / value / sub. .big = the one primary number on a screen. */
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .label { color: var(--muted); font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: .08em; }
.stat .value { font-size: clamp(1.15rem, 6.5vw, 1.5rem); font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1.15; overflow-wrap: anywhere; }
.stat.big .value { font-size: var(--fs-xl); letter-spacing: -.01em; }
.stat .sub { color: var(--muted); font-size: .82rem; overflow-wrap: anywhere; }
.stat.ok .value { color: var(--ok); }
.stat.warn .value { color: var(--warn); }
.stat.danger .value { color: var(--danger); }
.stat.info .value { color: var(--info); }

/* Buttons: every tap target is at least 44px tall, including the small ones used inside list rows. */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  padding: var(--s-2) var(--s-4); min-height: 44px; border-radius: var(--r-md); border: 1px solid var(--line-strong);
  background: var(--surface-2); color: var(--text); font-weight: 650; cursor: pointer; letter-spacing: .01em;
  transition: transform var(--t-fast) var(--ease), background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
  max-width: 100%;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(135deg, var(--pink), var(--violet)); border-color: transparent; color: #fff; box-shadow: 0 0 16px rgba(var(--pink-rgb),.3); }
.btn.cyan { background: linear-gradient(135deg, var(--cyan), #4a7bff); border-color: transparent; color: #04101a; }
.btn.lime { background: linear-gradient(135deg, var(--lime), #48d67a); border-color: transparent; color: #061a08; }
.btn.ghost { background: transparent; }
.btn.danger { border-color: rgba(var(--danger-rgb),.5); color: var(--danger); }
.btn.sm { padding: var(--s-1) var(--s-3); min-height: 44px; font-size: .88rem; border-radius: var(--r-md); }
.btn.icon { min-width: 44px; padding: 0 var(--s-2); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.field { display: flex; flex-direction: column; gap: var(--s-1); margin-bottom: var(--s-3); min-width: 0; }
.field label { color: var(--muted); font-size: .82rem; font-weight: 600; letter-spacing: .03em; }
.field input, .field select, .field textarea {
  background: var(--surface-3); border: 1px solid var(--line-strong); border-radius: var(--r-md);
  padding: var(--s-2) var(--s-3); min-height: 44px; color: var(--text); width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(var(--cyan-rgb),.18); }
.field .hint { color: var(--dim); font-size: var(--fs-sm); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); }
.check { display: flex; align-items: center; gap: var(--s-2); min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--pink); flex: 0 0 auto; }
input[type=range] { width: 100%; accent-color: var(--pink); min-height: 44px; }
input[type=date], input[type=month] { color-scheme: dark; }
select option { background: #140c28; }

/* Progress bars */
.bar { height: 12px; border-radius: 6px; background: rgba(255,255,255,.07); overflow: hidden; position: relative; }
.bar > i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--cyan), var(--pink)); box-shadow: 0 0 8px rgba(var(--pink-rgb),.45); transition: width var(--t-med) var(--ease); }
.bar.lime > i { background: linear-gradient(90deg, var(--lime), var(--cyan)); box-shadow: 0 0 8px rgba(var(--lime-rgb),.45); }
.bar.amber > i { background: linear-gradient(90deg, var(--amber), var(--pink)); box-shadow: 0 0 8px rgba(var(--amber-rgb),.4); }
.bar.over > i { background: linear-gradient(90deg, var(--amber), var(--danger)); box-shadow: 0 0 8px rgba(var(--danger-rgb),.55); }
.bar.thin { height: 8px; }

/* Pills. Status pills always carry text; colour is reinforcement, not the message. */
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: var(--fs-sm); font-weight: 700; letter-spacing: .03em; border: 1px solid var(--line-strong); color: var(--muted); white-space: nowrap; vertical-align: middle; }
.pill.pink { background: var(--pink-soft); color: var(--pink); border-color: rgba(var(--pink-rgb),.4); }
.pill.cyan, .pill.info { background: var(--cyan-soft); color: var(--cyan); border-color: rgba(var(--cyan-rgb),.4); }
.pill.lime, .pill.ok { background: var(--lime-soft); color: var(--lime); border-color: rgba(var(--lime-rgb),.4); }
.pill.amber, .pill.warn { background: var(--amber-soft); color: var(--amber); border-color: rgba(var(--amber-rgb),.4); }
.pill.danger { background: var(--danger-soft); color: var(--danger); border-color: rgba(var(--danger-rgb),.4); }
.pill.violet { background: var(--violet-soft); color: #c9b3ff; border-color: rgba(var(--violet-rgb),.5); }

/* Lists: one row = dot · main (title + meta, shrinks) · amount (never wraps) · optional action */
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-2) 0; border-bottom: 1px solid var(--line); min-width: 0; }
.list li:last-child { border-bottom: 0; }
.list .main { flex: 1 1 auto; min-width: 0; }
.list .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list .meta { color: var(--muted); font-size: var(--fs-sm); overflow-wrap: anywhere; }
.list .amt { font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; flex: 0 0 auto; max-width: 48%; overflow: hidden; text-overflow: ellipsis; }
.list li.tap, .list .main.tap { cursor: pointer; }
.list li .btn.sm { flex: 0 0 auto; }
.cat-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; box-shadow: 0 0 6px currentColor; background: currentColor; }

.seg { display: flex; gap: var(--s-1); background: var(--surface-3); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s-1); }
.seg button { flex: 1; background: none; border: 0; border-radius: var(--r-sm); padding: var(--s-2) var(--s-1); font-size: .9rem; min-height: 44px; min-width: 0; color: var(--muted); font-weight: 650; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button.active { background: var(--violet-soft); color: var(--text); box-shadow: inset 0 0 0 1px rgba(var(--violet-rgb),.5); }

.chips { display: flex; gap: var(--s-2); flex-wrap: wrap; }
.chip { padding: var(--s-1) var(--s-3); border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; color: var(--muted); font-size: .85rem; font-weight: 600; cursor: pointer; min-height: 44px; }
.chip.active { color: var(--text); border-color: var(--pink); background: var(--pink-soft); }

/* Bottom sheet. Dark scrim, no blur. */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(3,1,10,.82); display: flex; align-items: flex-end; justify-content: center; }
.modal .sheet {
  width: 100%; max-width: 640px; max-height: 92vh; overflow: auto;
  background: var(--bg-2); border: 1px solid var(--line-strong); border-bottom: 0; border-radius: 22px 22px 0 0;
  padding: var(--s-4) var(--s-4) calc(var(--s-5) + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 40px rgba(0,0,0,.5);
}
.modal .sheet h2 { margin-bottom: var(--s-3); }
.modal .actions { display: flex; gap: var(--s-2); margin-top: var(--s-2); flex-wrap: wrap; }
.modal .actions .btn { flex: 1 1 auto; }
@media (min-width: 700px) { .modal { align-items: center; } .modal .sheet { border-radius: 22px; border-bottom: 1px solid var(--line-strong); } }

/* Toast: solid, high-contrast, and sits above the FAB so neither hides the other. */
.toast { position: fixed; left: 50%; bottom: calc(var(--tabs-h) + var(--fab-h) + 26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  display: flex; align-items: center; gap: var(--s-3);
  background: #1a1030; border: 1px solid var(--cyan); color: var(--text); padding: var(--s-2) var(--s-4); border-radius: var(--r-md); box-shadow: 0 0 18px rgba(var(--cyan-rgb),.3), var(--shadow); font-weight: 600; width: max-content; max-width: min(92vw, 520px); }
.toast.xp { border-color: var(--lime); box-shadow: 0 0 18px rgba(var(--lime-rgb),.35), var(--shadow); }

const __m_js_storage_js = (() => {
  // Never silently overwrite an unreadable saved record. Failures remain visible until resolved.
  const blocked = new Set();
  const problems = new Map();
  function report(key, message) {
    if (message) problems.set(key, message); else problems.delete(key);
    if (typeof window !== "undefined" && window?.dispatchEvent) window.dispatchEvent(new Event("glowstick-storage"));
  }
  function storageProblem(key) { return problems.get(key) || ""; }
  function rawSaved(key) { try { return localStorage.getItem(key); } catch { return null; } }
  function load(key, blank, validate) {
    try {
      const raw = localStorage.getItem(key);
      if (raw) {
        const value = JSON.parse(raw);
        if (!value || typeof value !== "object" || Array.isArray(value)) throw new Error("invalid saved record");
        if (validate) validate(value);
        return value;
      }
    } catch {
      blocked.add(key);
      report(key, "Saved data could not be read. It has been preserved. Export the original and restore a valid backup before continuing.");
    }
    return blank();
  }
  function persist(key, obj, replaceUnreadable = false) {
    if (blocked.has(key) && !replaceUnreadable) return false;
    try {
      localStorage.setItem(key, JSON.stringify(obj));

      report(key, "Changes are not saved. Keep this app open, export a backup, then free device space or retry saving.");
      return false;
    }

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  function readFileText(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result));
      r.onerror = () => rej(r.error);
      r.readAsText(file);
    });

})();

/* ---- js/backup.js ---- */
const __m_js_backup_js = (() => {
  // Validate portable backups before changing either current data or persistent storage.
  const object = (x) => x && typeof x === "object" && !Array.isArray(x);
  const number = (x) => typeof x === "number" && Number.isFinite(x);

    if (value.settings.income !== undefined) check(number(value.settings.income) && value.settings.income >= 0, "Invalid income");
    if (value.game.xp !== undefined) check(number(value.game.xp) && value.game.xp >= 0, "Invalid XP");
    for (const t of value.tx) check(text(t.id) && date(t.date) && text(t.desc) && number(t.amount) && text(t.cat), "Invalid transaction");
    for (const b of value.bills) check(text(b.id) && text(b.name) && number(b.amount) && b.amount >= 0 && number(b.day) && b.day >= 1 && b.day <= 31 && object(b.paid), "Invalid bill");

})();

/* ---- data/personal.js ---- */
const __m_data_personal_js = (() => {

/* ---- js/state.js ---- */

    { id: "transport", name: "Fuel & transport", color: "#21f0ff" },
    { id: "housing", name: "Rent & housing", color: "#9b6bff" },
    { id: "utilities", name: "Utilities & phone", color: "#4a7bff" },
    { id: "subs", name: "Subscriptions", color: "#ff7ae0" },
    { id: "health", name: "Health", color: "#48d67a" },
    { id: "shopping", name: "Shopping", color: "#ffb52e" },
    { id: "gaming", name: "Gaming", color: "#ff4f6e" },
    { id: "fun", name: "Fun & going out", color: "#ff9ecf" },
    { id: "loans", name: "Loan payments", color: "#b78cff" },
    { id: "savings", name: "Savings transfer", color: "#6bffd6" },

        income: 0,          // expected take-home per MONTH (derived; everything reads this)
        incomeFreq: "monthly", // how it was entered: "monthly" | "biweekly" | "weekly"
        incomeEntered: 0,   // the number as typed, in that frequency
        payday: 1,          // day of month
        sources: { manual: true, csv: true, notif: false },
        notifApps: [],      // package names to capture from; empty = anything that looks like money

  function today() { return toISO(new Date()); }
  function toISO(d) {

/* ---- js/router.js ---- */
const __m_js_router_js = (() => {
  // Tab routing. Each view exports render(root) and optionally unmount().
  // Navigating replaces the #view element so old listeners and timers go away.

  const views = {};
  let currentTab = "home";

  function register(name, mod) { views[name] = mod; }

  function go(tab) {
    if (!views[tab]) return;
    views[currentTab]?.unmount?.();
    currentTab = tab;
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
    refresh();
    window.scrollTo({ top: 0 });
  }

  function refresh() {
    const old = document.getElementById("view");
    const fresh = old.cloneNode(false);
    old.replaceWith(fresh);
    views[currentTab].render(fresh);
  }

  function current() { return currentTab; }
  return { register, go, refresh, current };
})();

/* ---- js/demo.js ---- */

/* ---- js/ui/common.js ---- */

    if (ev.type === "draw") setTimeout(() => { celebrate("🎟", "Coupon draw earned", `${ev.why}. Pick a category and see what you get.`, () => { openDraw(); }); peek("coupon"); }, 300);
