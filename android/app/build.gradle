plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

// Release signing: put a keystore.properties next to this file (see keystore.properties.example) with
// storeFile / storePassword / keyAlias / keyPassword. Never commit it or the .jks (both are in .gitignore).
// Release tasks require an explicit signing configuration; debug builds remain available for demos.
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
def hasKeystore = false
if (ksFile.exists()) {
    ksFile.withInputStream { ksProps.load(it) }
    hasKeystore = ksProps['storeFile'] && rootProject.file(ksProps['storeFile']).exists()
    if (!hasKeystore) println "WARNING: keystore.properties found but storeFile is missing; release tasks will fail"
} else {
    println "WARNING: no android/keystore.properties; release tasks will fail; use a Debug build for local demos"
}

android {
    namespace 'app.glowstick'
    compileSdk 34
    defaultConfig { applicationId "app.glowstick"; minSdk 26; targetSdk 34; versionCode 2; versionName "1.1.0" }

    buildFeatures { buildConfig true }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    // Two flavors, one dimension. `personal` = the owner's build: its manifest adds SEND_SMS and its assets come
    // from src/main (written by `python build.py`). `store` = the public build: no SEND_SMS anywhere in the merged
    // manifest, and its assets come from src/store (written by `python build.py --store`), which override src/main.
    flavorDimensions "profile"
    productFlavors {
        // The personal flavor only exists in a checkout that has src/personal (the owner's private tree). The public
        // repository ships the store flavor alone.
        if (project.file('src/personal').exists()) {
            personal { dimension "profile" }
        }
        // Own package id so a store/demo install can sit next to the personal app on the same phone.
        // This is also the id the Play listing will carry; the debug build is labelled "Glowstick Demo".
        store { dimension "profile"; applicationIdSuffix ".store" }
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            if (hasKeystore) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
// The store APK must never fall back to the personal bundle in src/main/assets: refuse to build it unless the
// store bundle exists (python build.py --store writes it).
android.applicationVariants.all { variant ->
    if (variant.flavorName == 'store') {
        variant.preBuildProvider.configure {
            doFirst {
                def storeHtml = file('src/store/assets/app/index.html')
                if (!storeHtml.exists()) throw new GradleException("store flavor: ${storeHtml} is missing; run `python build.py --store` first")
                if (storeHtml.text.contains('PROFILE = "personal"')) throw new GradleException("store flavor: ${storeHtml} is a PERSONAL bundle; run `python build.py --store`")
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

// Never produce a misleading debug-signed release artifact.
gradle.taskGraph.whenReady { graph ->
    if (!hasKeystore && graph.allTasks.any { it.name.toLowerCase().contains('release') && it.project == project }) {
        throw new GradleException("Release signing is required. Configure android/keystore.properties, or build a Debug demo.")
    }
}
